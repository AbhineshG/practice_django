{% extends 'base.html' %}
<title>{% block title %}Policy{% endblock %}</title>
{% block content %}
<div class="container">
    <h2>Register form</h2>

    <div class="form-group">
        <label for="email">User Name :</label>
        <input type="text" class="form-control" id="username" placeholder="Enter username" name="username" value="">
    </div>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" value="">
    </div>

    <div class="form-group">
        <label for="contactNo">Contact:</label>
        <input type="text" class="form-control" id="contactNo" placeholder="Enter contact" name="contactNo" value="">
    </div>
    <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" class="form-control" id="address" placeholder="Enter address" name="address" value="">
    </div>
</div>
<button type="submit" class="btn btn-primary" onclick="profileUpdate()">Submit</button>
<p id="response" style="color: green;"></p>


</div>
<script>
    var userName = localStorage.getItem('Username');
    var email = localStorage.getItem('email');
    var contactNo = localStorage.getItem('contactNo');
    var address = localStorage.getItem('address');

    document.getElementById("username").value = userName;
    document.getElementById("email").value = email;
    document.getElementById("contactNo").value = contactNo;
    document.getElementById("address").value = address;

    function profileUpdate() {
        var username = document.getElementById("username").value;

        var email = document.getElementById("email").value;
        var contactNo = document.getElementById("contactNo").value;
        var address = document.getElementById("address").value;
        console.log(username, email, contactNo, address);
        var data = { username: username, email: email, contactNo: contactNo, address: address }
        console.log(data);

        var url = "http://127.0.0.1:8000/userLogin/profileUpdate/"
        var data = new FormData();
        data.append("username", username);
        data.append("email", email);
        data.append("contactNo", contactNo);
        data.append("address", address); 
        var xhr = new XMLHttpRequest();
        xhr.withCredentials = true;

        xhr.addEventListener("readystatechange", function () {
            if (this.readyState === 4) {
                responseData = JSON.parse(this.responseText)
                console.log(responseData);
                localStorage.setItem('Username', responseData.userData[0].username);
                localStorage.setItem('email', responseData.userData[0].email);
                localStorage.setItem('role', responseData.userData[0].roles);
                localStorage.setItem('id', responseData.userData[0].id);
                localStorage.setItem('contactNo', responseData.userData[0].contactNo);

                var responseMessage = responseData.message
                document.getElementById("response").innerHTML = responseMessage;
            }
        });

        xhr.open("POST", url);
    

        xhr.send(data);
    }
</script>
{% endblock %}
